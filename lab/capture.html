function phoneBox() {

}

function layoutClouds() {
  if (!W) return;

  for (let i = 0; i < n; i++) {
    clouds.push({
      x: Math.random() * W,

}
function layoutSpace() {
  if (!W) return;

  if (planets.length) return;

  // Smaller sizes + parallax speeds so they read as distant scenery, not hazards.
  const specs = [
    { lane: "L", band: 0.10, size: 22, speed: 0.12, a: 0.55, style: "gas", hue: 0 },
    { lane: "R", band: 0.16, size: 28, speed: 0.18, a: 0.6, style: "ring", hue: 1 },
    { lane: "L", band: 0.28, size: 18, speed: 0.1, a: 0.42, style: "rock", hue: 2 },
    { lane: "R", band: 0.36, size: 24, speed: 0.22, a: 0.58, style: "gas", hue: 3 },
    { lane: "L", band: 0.48, size: 26, speed: 0.14, a: 0.5, style: "ice", hue: 4 },
    { lane: "R", band: 0.58, size: 20, speed: 0.2, a: 0.52, style: "rock", hue: 5 },
    { lane: "L", band: 0.68, size: 30, speed: 0.16, a: 0.48, style: "ring", hue: 6 },
    { lane: "R", band: 0.78, size: 17, speed: 0.24, a: 0.56, style: "gas", hue: 7 },
    { lane: "L", band: 0.88, size: 21, speed: 0.13, a: 0.45, style: "ice", hue: 8 },
    { lane: "R", band: 0.24, size: 15, speed: 0.11, a: 0.38, style: "rock", hue: 9 },
    { lane: "L", band: 0.40, size: 14, speed: 0.09, a: 0.36, style: "gas", hue: 10 },
    { lane: "R", band: 0.70, size: 23, speed: 0.19, a: 0.54, style: "ring", hue: 11 }
  ];
  for (let i = 0; i < specs.length; i++) {
    const s = specs[i];
    const edge = s.lane === "L" ? 0.04 + (i % 3) * 0.028 : 0.90 + (i % 3) * 0.028;
    const jitter = ((Math.sin(i * 19.7) * 43758.5453) % 1 + 1) % 1;
    planets.push({
      xN: Math.max(0.02, Math.min(0.98, edge + (jitter - 0.5) * 0.02)),
      yN: (s.band + jitter * 0.06) % 1,
      s: s.size,
      speed: s.speed,
      a: s.a,
      style: s.style,
      hue: s.hue,
      seed: i * 17.13
    });
  }
}

  bird.x = Math.max(40, Math.min(W - 40, clientX - rect.left));

function localPoint(e) {

function owns(id) {
  if (id === "sky" || id === "bird") return true;
  if (id === "night" || id === "space" || id === "ufo" || id === "adfree") return true;
  if (id === "spaceufo" || id === "upgrade_ufo" || id === "upgrade_space") return true;
  return localStorage.getItem("flyby-own-" + id) === "1";
}
function chromeColorForTheme(id) {
  const th = themeById(id);
  if (id === "night") return th.top || "#12182a";
  if (id === "space") return th.top || "#05060a";
  return "#b7e4f6";
}
function syncChrome() {
  const bg = chromeColorForTheme(theme);
  document.documentElement.style.background = bg;
  document.body.style.background = bg;
  canvas.style.background = bg;
  const meta = document.getElementById("theme-color") || document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", bg);
}
function applyTheme(id) {
  if (id === "night" && !owns("night")) id = "sky";
  if (id === "space" && !owns("space")) id = "sky";
  if (id !== "sky" && id !== "night" && id !== "space") id = "sky";
  theme = id;
  localStorage.setItem("flyby-theme", theme);
  syncChrome();
  if (theme === "space") {
    planets = [];
    layoutSpace();
  }
}
function applyCharacter(id) {
  if (id === "ufo" && !owns("ufo")) id = "bird";
  if (id !== "bird" && id !== "ufo") id = "bird";
  character = id;
  localStorage.setItem("flyby-character", character);
}
function flybyCall(action, extra) {
  const msg = Object.assign({ action: action }, extra || {});
  try {
    const h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.flyby;
    if (h) { h.postMessage(msg); return true; }
  } catch (err) {}
  return false;
}
window.flybyOwned = function (state) {
  if (!state) return;
  if (state.night) localStorage.setItem("flyby-own-night", "1");
  if (state.space || state.spaceufo) localStorage.setItem("flyby-own-space", "1");
  if (state.ufo || state.spaceufo) localStorage.setItem("flyby-own-ufo", "1");
  if (state.adfree) localStorage.setItem("flyby-own-adfree", "1");
  // Re-apply saved prefs only — never force a theme/character or gate one by the other.
  applyTheme(localStorage.getItem("flyby-theme") || theme);
  applyCharacter(localStorage.getItem("flyby-character") || character);
};
function saveAdCycle() {
  localStorage.setItem("flyby-free-left", String(freeLeft));
  localStorage.setItem("flyby-ad-grace", String(adGrace));
  localStorage.setItem("flyby-next-free-batch", String(nextFreeBatch));
  localStorage.setItem("flyby-cycle-ver", "3");
}
function grantAfterAd() {
  freeLeft = nextFreeBatch;
  nextFreeBatch = nextFreeBatch === 2 ? 1 : 2;
  saveAdCycle();
}
window.flybyReward = function (result) {
  if (result === "viewed") {
    adGrace = 3;
    freeLeft = 0;
    saveAdCycle();
    reset();
    return;
  }
  if (result === "none" || result === "skipped") {
    adGrace = 0;
    grantAfterAd();
    reset();
  }

let theme = localStorage.getItem("flyby-theme") || "sky";
if (theme === "night" && !owns("night")) theme = "sky";

const themes = [
  { id: "sky", name: "sky", top: "#d9f3ff", mid: "#bfe6f8", bot: "#9ed4ef", ink: "#1a1a1a", night: false },
  { id: "night", name: "night", top: "#12182a", mid: "#1a2740", bot: "#0c101c", ink: "#e6d3b0", night: true },
  { id: "space", name: "space", top: "#05060a", mid: "#0a0c14", bot: "#020308", ink: "#e6d3b0", space: true }
];
const CHARACTERS = [
  { id: "bird", name: "bird" },
  { id: "ufo", name: "ufo" }
];
syncChrome();
let stars = [];
function themeById(id) {
  return themes.find(t => t.id === id) || themes[0];
}
function ink() { return themeById(theme).ink || "#1a1a1a"; }
const cream = "#e6d3b0";
function layoutStars() {
  stars = [];
  farStars = [];
  nearStars = [];
  for (let i = 0; i < 56; i++) {
    const s = Math.sin(i * 12.9898) * 43758.5453;
    const r = s - Math.floor(s);
    const s2 = Math.sin(i * 78.233) * 12345.678;
    const r2 = s2 - Math.floor(s2);
    const star = { x: r, y: r2, s: r > 0.85 ? 1.7 : 0.9, a: 0.35 + r2 * 0.4 };
    farStars.push(star);
    stars.push(star);
  }
  for (let i = 0; i < 28; i++) {
    const s = Math.sin(i * 41.17 + 3.1) * 23421.91;
    const r = s - Math.floor(s);
    const s2 = Math.sin(i * 9.33 + 1.7) * 9812.44;
    const r2 = s2 - Math.floor(s2);
    nearStars.push({ x: r, y: r2, s: r > 0.7 ? 2.2 : 1.3, a: 0.55 + r * 0.4 });
  }
}
function startBox() {
  const w = Math.min(200, W - 64);
  const h = 54;
  return { x: W / 2 - w / 2, y: H * 0.46, w, h };
}
function menuBtn(i) {
  const w = Math.min(200, W - 64);

function hitBox(b, x, y) {
  return x >= b.x - 8 && x <= b.x + b.w + 8 && y >= b.y - 8 && y <= b.y + b.h + 8;
}
function inStart(x, y) { return hitBox(startBox(), x, y); }

}

let buyToast = null;
function showBuyToast(msg) {
  buyToast = { msg: msg, t: 0 };
}
window.flybyBuyResult = function (result) {
  // ok | cancel | missing | error:<msg>
  if (!result || result === "ok") { buyToast = null; return; }
  if (result === "cancel") { buyToast = null; return; }
  if (result === "missing") showBuyToast("not available yet");
  else if (String(result).indexOf("error:") === 0) showBuyToast("purchase failed");
  else showBuyToast(String(result));
};
function buyProduct(id) {
  if (owns(id)) return;
  const pid = PRODUCTS[id];
  if (!pid) { showBuyToast("unknown product"); return; }
  showBuyToast("opening store…");
  const ok = flybyCall("buy", { product: id, productId: pid, action: "buy" });
  if (!ok) showBuyToast("store unavailable");
}
function freeAgain() {
  return owns("adfree") || adGrace > 0 || freeLeft > 0;
}
function noteDeath() {

}
function takeFreeContinue() {
  if (owns("adfree")) { reset(); return; }
  if (adGrace > 0) {
    adGrace -= 1;
    saveAdCycle();
    reset();
    return;
  }
  if (freeLeft > 0) {
    freeLeft -= 1;
    saveAdCycle();
    reset();
  }
}
function useContinue() {
  if (freeAgain()) { takeFreeContinue(); return; }
  if (!flybyCall("rewarded")) {

function spaceUfoOffer() {

  if (!hasSpace && !hasUfo) return { product: "spaceufo", label: "buy", name: "Space + UFO" };

const BUNDLES = [
  { id: "spaceufo", name: "Space + UFO", themes: ["space"], characters: ["ufo"], priceHint: "bundle" }
];
function ownedThemes() {
  return themes.filter(th => th.id === "sky" || owns(th.id));
}
function optionSections() {

    { id: "characters", label: "Characters" },
    { id: "bundles", label: "Bundles" }

}
function optionChildren(id) {
  if (id === "theme") {
    const list = [];
    const seen = new Set();
    ownedThemes().forEach(th => {
      if (seen.has(th.id)) return;
      seen.add(th.id);
      list.push({ id: th.id, name: th.name, action: "theme" });
    });
    BUNDLES.filter(b => owns(b.id)).forEach(b => {
      (b.themes || []).forEach(tid => {
        const th = themeById(tid);
        if (!th || seen.has(th.id)) return;
        seen.add(th.id);
        list.push({ id: th.id, name: th.name, action: "theme" });

    return list.length ? list : [{ id: "soon", name: "coming soon", action: "none" }];
  }
  if (id === "characters") {
    const seen = new Set();
    const list = [];
    CHARACTERS.filter(c => owns(c.id)).forEach(c => {
      if (seen.has(c.id)) return;
      seen.add(c.id);
      list.push({ id: c.id, name: c.name, action: "character" });
    });
    BUNDLES.filter(b => owns(b.id)).forEach(b => {
      (b.characters || []).forEach(cid => {
        const c = CHARACTERS.find(x => x.id === cid);

        seen.add(c.id);
        list.push({ id: c.id, name: c.name, action: "character" });

          return;

        const items = storeItems();
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          if (!hitBox(storeRow(i), x, y)) continue;
          if (item.id === "theme") { panel = "store-theme"; break; }
          if (item.id === "characters") { panel = "store-characters"; break; }
          if (item.id === "bundles") { panel = "store-bundles"; break; }
          if (item.id === "adfree") { buyProduct("adfree"); break; }
          break;
        }
        if (hitBox(restoreBox(), x, y)) { flybyCall("restore"); return; }
      }
      if (panel === "store-theme") {
        for (let i = 0; i < themes.length; i++) {
          const th = themes[i];
          if (!hitBox(themeCard(i), x, y)) continue;
          if (th.id === "night" && !owns("night")) { buyProduct("night"); break; }
          if (th.id === "space" && !owns("space")) { buyProduct("space"); break; }
          applyTheme(th.id);
          break;
        }
      }
      if (panel === "store-characters") {
        for (let i = 0; i < CHARACTERS.length; i++) {
          const ch = CHARACTERS[i];
          if (!hitBox(characterCard(i), x, y)) continue;

          if (ch.id === "ufo" && !owns("ufo")) { buyProduct("ufo"); break; }

function planetPalette(hue) {

    ["#d4a574", "#f0d0a0", "#9a6b3c", "#ffe4c0"],
    ["#6b8cae", "#9bb8d4", "#3d5570", "#c8dcf0"],
    ["#c9a84c", "#e8d078", "#8a7030", "#fff0b0"],
    ["#7a9e6a", "#a8c890", "#4a6a3c", "#d0e8b8"],
    ["#b85c7a", "#e090a8", "#7a3048", "#f0c0d0"],
    ["#8a7cc0", "#b0a4e0", "#524878", "#d8d0f8"],
    ["#d07040", "#f0a060", "#8a4020", "#ffd0a0"],
    ["#5a9e9e", "#88c8c8", "#306868", "#b8e8e8"],
    ["#a07050", "#c89870", "#604030", "#e8c8a8"],

      ctx.beginPath();
      ctx.ellipse(0, yy, s * 0.94, s * 0.08, 0.05 * Math.sin(seed + b), 0, Math.PI * 2);

function drawEarthPeek() {

    ctx.stroke();

  ctx.restore();
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, Math.PI * 0.95, Math.PI * 1.55);

  ctx.lineWidth = 3.5;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, R, Math.PI * 0.95, Math.PI * 1.55);
  ctx.strokeStyle = "#1a1a1a";
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.restore();

function drawSpace() {

    const y = ((s.y * H + skyScroll * 0.25) % (H + 40)) - 20;
    ctx.globalAlpha = s.a * 0.7;

    const y = ((p.yN * (H + 200) + skyScroll * p.speed) % (H + 200)) - 100;
    const x = p.xN * W;
    ctx.globalAlpha = p.a;
    drawPlanetAt(x, y, p.s, p.style, p.hue, p.seed);

  ctx.globalAlpha = 1;
  // near stars (faster)
  for (const s of nearStars) {
    const y = ((s.y * H + skyScroll * 0.85) % (H + 40)) - 20;
    ctx.globalAlpha = s.a;
    ctx.fillStyle = "#fff8e8";
    ctx.beginPath();
    ctx.arc(s.x * W, y, s.s, 0, Math.PI * 2);

function characterCard(i) {

function drawCharacterShot(ch, r) {
  const labelH = 40;
  const shot = { x: r.x, y: r.y, w: r.w, h: r.h - labelH };

  ctx.beginPath();
  ctx.roundRect(shot.x, shot.y, shot.w, shot.h, 16);

function bundleCard(i) {

}
function drawBundleShot(bdl, r) {

let last = performance.now();
function loop(now) {
  const dt = Math.min(32, now - last);
  last = now;
  if (!W) resize();
  if (!bird.x) {
    bird.x = W * 0.5;
    bird.y = H * 0.72;
  }

  if (started && alive && !window.__flybyFreeze) {
    dist += dt * 0.07;
    bird.flap += dt;
    if (bird.flap > 90) { bird.flap = 0; bird.frame = (bird.frame + 1) % 4; }
    spawn += dt;
    if (spawn > pace().every) {
      if (spawnObs()) spawn = 0;
    }
    const score = Math.floor(dist);
    while (nextMark < marks.length && score >= marks[nextMark]) {
      const n = marks[nextMark];
      burst((n / 1000) + "k");
      nextMark++;
    }
    for (const o of obstacles) {
      o.y += o.vy * (dt / 16);
      if (o.kind === "bird") {
        o.flap += dt;
        if (o.flap > 110) { o.flap = 0; o.frame = (o.frame + 1) % 4; }
      } else if (o.kind === "meteor") {
        o.rot = (o.rot || 0) + (o.spin || 0) * dt;

    obstacles = obstacles.filter(o => o.y < H + 80);

        noteDeath();
        alive = false;

    bits = bits.filter(b => b.life > 0);
    for (const b of bits) {
      b.x += b.vx;
      b.y += b.vy;
      b.vy += 0.16;
      b.rot += 0.12;
      b.life -= 1;

    else if (o.kind === "meteor") drawMeteor(o);
    else if (o.kind === "foe") drawFoeUfo(o);

  drawCheer();

    ctx.fillText("flyBy  " + Math.floor(dist), 16, 40);

    const th = 36;
    const tx = W / 2 - tw / 2;
    const ty = H - 90;
    ctx.beginPath();
    ctx.roundRect(tx, ty, tw, th, 10);
    ctx.fill();
    ctx.fillStyle = cream;
    ctx.font = "600 15px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(buyToast.msg, W / 2, ty + th / 2);
    ctx.restore();
    if (buyToast.t > 120) buyToast = null;

}
resize();
requestAnimationFrame(loop);

// CAPTURE BRIDGE
window.__flyby = {
  get theme() { return theme; },
