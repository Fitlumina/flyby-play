  const vv = window.visualViewport;

/** Snapshot absorb pop. x0/y0 = orb contact spawn; bx0/by0 = player at contact (tracking origin). */
function makeArcadeOrbPop(id, x0, y0, color, extra) {

    id, x0, y0, color,
    bx0: tgt.x, by0: tgt.y,

/** Carlos lock 2026-09-21: timed (MG/laser/ghost) replaces active timed — no double.

  arcadeOrbPop = makeArcadeOrbPop(p.id, p.x, p.y, p.color);
  if (p.id === "spare") {
    if (arcadeSpareArmed) {
      // already holding spare — ignore second spare (no stack)
      showBuyToast("Spare already armed");
      return;
    }
    arcadeSpareArmed = true; // keeps any active timed perk
    showBuyToast("Spare life armed");
    return;
  }
  // combat/timed orb: cancel/replace current timed perk (spare stays if armed)
  arcadeBullets = [];
  arcadeFireAt = 0;
  arcadeActive = {
    id: p.id,
    label: p.label,
    color: p.color,
    // Absorb plays inside the window; extend so the 15s/12s is not eaten.
    until: performance.now() + p.duration * 1000 + ARCADE_ABSORB_MS

  arcadeFormArm(p.id, { force: true });
  if (p.id === "mg") arcadeMgTriggerBreak();

/** In-run spare consume: clear near threat, stay alive, keep dist/score. Not a death. */

  obstacles = [];
  arcadeBullets = []; // leftover bolts shouldn't matter; cheap clear
  playerDeathFx = null;

  // Snap to Classic flight line (spare is never free-2D)
  bird.y = H * 0.72;

/** Visual only: Ghost perk fades the playable. Last 2.8s square-flashes opaque ↔ 0.55, faster as it ends. */
const ARCADE_GHOST_ALPHA = 0.55;
const ARCADE_GHOST_FLASH_MS = 2800;
function arcadeGhostAlpha() {
  if (!arcadeActive || arcadeActive.id !== "invincible") return 1;
  const remain = arcadeActive.until - performance.now();
  if (remain <= 0) return 1;
  if (remain > ARCADE_GHOST_FLASH_MS) return ARCADE_GHOST_ALPHA;
  const t = 1 - (remain / ARCADE_GHOST_FLASH_MS);
  const period = 400 - t * 320; // 400→80
  const phase = (ARCADE_GHOST_FLASH_MS - remain) % period;

  if (window.__arcadeDemoFormation) return;
  // one on path at a time — never cluster
  if (arcadePickups.length > 0) return;
  const pool = ARCADE_PERK_DEFS.filter(d => {
    if (d.id === "spare") {
      // spare max 1: do not spawn another while armed
      return score >= (d.scoreGate || 5500) && !arcadeSpareArmed;
    }
    return true;
  });
  if (!pool.length) return;
  const def = pool[Math.floor(Math.random() * pool.length)];
  const x = W * (0.18 + Math.random() * 0.64);
  arcadePickups.push({
    id: def.id,
    label: def.label,
    color: def.color,
    duration: def.duration,
    x,
    y: -40,
    r: 22,
    vy: 3.2 + Math.random() * 1.2,
    born: performance.now()

function tickArcadePerks(dt, score) {
  if (!isArcade()) return;
  // Capture scrub (?demoPickup&t=): keep seeded orb/pop/active frozen for still/GIF frames
  if (window.__arcadeCaptureScrub) return;
  // Clock advances only when the path is clear and no timed perk is playing out.
  if (arcadePickups.length === 0 && !arcadeActive) {
    arcadePerkSpawn += dt;
    // 16–26s between singles once the path is clear (play it out, then much later).
    if (arcadePerkSpawn > ARCADE_PERK_GAP_MIN_MS + Math.random() * ARCADE_PERK_GAP_JITTER_MS) {
      arcadePerkSpawn = 0;
      maybeSpawnArcadePerk(score);

    arcadePerkSpawn = 0;

    const dx = p.x - bird.x;
    const dy = p.y - bird.y;
    if (dx * dx + dy * dy > (p.r + bird.r) * (p.r + bird.r)) return true;
    applyArcadePickup(p);
    return false;

    const endingId = arcadeActive.id;
    arcadeActive = null;
    arcadeFormSeenId = "";
    arcadeFormVariant = "";
    arcadeFormSweepSide = 0;
    arcadeFormTunnelX = 0;
    arcadeFormTunnelDir = 1;
    arcadeFormGhostSide = 0;
    arcadeMgBreakUntil = 0;
    bird.y = H * 0.72;

/** Soft halo so orbs read on Sky and dark themes (Night/Space/Future). */
function drawArcadeOrbSprite(img, x, y, size, color, glow, scale) {
  // Prefer glow intensity pulse over hard PNG scale (avoids square canvas edges)
  const s = size * (scale == null ? 1 : scale);
  ctx.save();
  ctx.translate(x, y);
  // Soft circular halo ONLY via arc fill (source-over — no "lighter" square fringe)
  ctx.globalCompositeOperation = "source-over";
  const haloR = s * (0.58 + glow * 0.16);

    r = parseInt(color.slice(1, 3), 16);
    gch = parseInt(color.slice(3, 5), 16);
    b = parseInt(color.slice(5, 7), 16);

  // glow is already 0.3..0.7 soft; keep peak alpha gentle (no spike)
  const a0 = 0.14 + glow * 0.32;
  g.addColorStop(0, "rgba(" + r + "," + gch + "," + b + "," + a0 + ")");
  g.addColorStop(0.55, "rgba(" + r + "," + gch + "," + b + "," + (a0 * 0.35) + ")");
  g.addColorStop(1, "rgba(" + r + "," + gch + "," + b + ",0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, haloR, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(0, 0, s * 0.46, 0, Math.PI * 2);

    ctx.drawImage(img, -s / 2, -s / 2, s, s);

    ctx.arc(0, 0, s * 0.34, 0, Math.PI * 2);

      i, a0, wedge,
      restX: cx, restY: cy,
      burst: 11 + arcadeHash01(i, 5) * 9,
      spin: (arcadeHash01(i, 6) - 0.5) * 9,
      rot0: (arcadeHash01(i, 11) - 0.5) * 0.8,

  ctx.fillText(String(Math.floor(dist)), W / 2, H * 0.4 + 34);
  const b = continueBox();
  sketchRound(b.x, b.y, b.w, b.h);
  ctx.beginPath();
  ctx.moveTo(b.x + 22, b.y + 16);
  ctx.lineTo(b.x + 22, b.y + 38);
  ctx.lineTo(b.x + 38, b.y + 27);
  ctx.closePath();
  ctx.stroke();
  ctx.font = "600 20px ui-sans-serif, system-ui, sans-serif";
  ctx.fillText("again", b.x + b.w / 2 + 8, b.y + 34);
  ctx.font = "15px ui-sans-serif, system-ui, sans-serif";
  ctx.font = "15px ui-sans-serif, system-ui, sans-serif";
  ctx.fillText(
    owns("adfree") ? "new flight"
      : adGrace > 0 ? ("new flight · " + adGrace + " free left")
      : freeLeft > 0 ? "new flight"
      : "watch · full = 3 free",
    W / 2,
    b.y + b.h + 22
  );
  const m = deathMenuBox();
  ctx.lineWidth = 1.8;
  sketchRound(m.x, m.y, m.w, m.h);
  ctx.font = "600 16px ui-sans-serif, system-ui, sans-serif";
  ctx.fillText("menu", m.x + m.w / 2, m.y + 26);
  const rep = reportAdBox();
  const priv = privacyBox();
  ctx.lineWidth = 1.6;
  sketchRound(rep.x, rep.y, rep.w, rep.h);
  sketchRound(priv.x, priv.y, priv.w, priv.h);
  ctx.font = "600 13px ui-sans-serif, system-ui, sans-serif";
  ctx.fillText("report ad", rep.x + rep.w / 2, rep.y + 22);
  ctx.fillText("privacy", priv.x + priv.w / 2, priv.y + 22);
  ctx.textAlign = "left";
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(32, now - last);
  last = now;
  if (!W) resize();
  if (!bird.x) {
    bird.x = W * 0.5;
    bird.y = H * 0.72;
  }

  if (!(started && alive && pointer)) {
    taxiDx *= 0.82;
    if (Math.abs(taxiDx) < 0.35) {
      taxiDx = 0;
      taxiBank = 0;
    }
  }
  if (taxiThrust > 0) taxiThrust -= 1;
  if (!started && character === "flytaxi") {
    bird.flap += dt * 0.55;
    if (bird.flap > 110) { bird.flap = 0; bird.frame = (bird.frame + 1) % 4; }
  }

  if (started && alive) {
    dist += dt * 0.07;
    bird.flap += dt;
    if (bird.flap > 90) { bird.flap = 0; bird.frame = (bird.frame + 1) % 4; }
    spawn += dt;
    const freezeSpawn = window.__arcadePreview || (window.__arcadeLiveCapture && !window.__arcadeDemoFormation && !window.__arcadeRealPaceCapture);
    const perkEndGrace = arcadePerkEndGraceUntil && performance.now() < arcadePerkEndGraceUntil;
    if (arcadePerkEndGraceUntil && !perkEndGrace) arcadePerkEndGraceUntil = 0;
    const everyNow = pace().every;
    if (!freezeSpawn && !perkEndGrace && spawn > everyNow) {
      if (spawnObs()) spawn = 0;
    }
    const score = Math.floor(dist);
    tickArcadePerks(dt, score);
    while (nextMark < marks.length && score >= marks[nextMark]) {
      const n = marks[nextMark];
      burst((n / 1000) + "k");
      nextMark++;
    }
    const arcadeDive = isArcade()
      && arcadeActive
      && (arcadeActive.id === "mg" || arcadeActive.id === "laser")
      && !window.__arcadeCaptureScrub;
    if (arcadeMgBreakUntil && performance.now() >= arcadeMgBreakUntil) {
      for (const o of obstacles) {
        if (o.arcadeMgPeel) { o.vx = 0; o.arcadeMgPeel = false; }
      }
      arcadeMgBreakUntil = 0;
    }
    for (const o of obstacles) {
      o.y += o.vy * (dt / 16);
      if (o.vx) {
        o.x += o.vx * (dt / 16);
        const hw = bodyHw(o.kind, o.s);
        const minX = hw + 8;
        const maxX = W - hw - 8;
        if (o.x <= minX) { o.x = minX; o.vx = 0; }
        else if (o.x >= maxX) { o.x = maxX; o.vx = 0; }
      }
      if (arcadeDive && o.arcadeDiver) {
        const dx = bird.x - o.x;
        const steer = 0.04;
        const vmax = 2.4;
        let nudge = dx * steer;
        if (nudge > vmax) nudge = vmax;
        else if (nudge < -vmax) nudge = -vmax;
        o.x += nudge * (dt / 16);
        const hw = bodyHw(o.kind, o.s);
        if (o.x < hw + 8) o.x = hw + 8;
        else if (o.x > W - hw - 8) o.x = W - hw - 8;
      }
      if (o.kind === "bird") {
        o.flap += dt;
        if (o.flap > 110) { o.flap = 0; o.frame = (o.frame + 1) % 4; }
      } else if (o.kind === "meteor") {
        o.rot = (o.rot || 0) + (o.spin || 0) * dt;
      }
    }
    obstacles = obstacles.filter(o => o.y < H + 80);
    tickArcadeCombat(dt);
    for (const o of obstacles) {
      if (hit(o) && !window.__arcadeLiveCapture) {
        if (arcadeActive && arcadeActive.id === "invincible" && performance.now() < arcadeActive.until) continue;
        if (arcadeSpareIFrameUntil && performance.now() < arcadeSpareIFrameUntil) continue;
        if (isArcade() && arcadeSpareArmed) {
          consumeArcadeSpareLife();
          break; // one consume per tick; score (dist) untouched; no noteDeath
        }
        if (Math.floor(dist) > best) {
          best = Math.floor(dist);
          localStorage.setItem("flyby-best", String(best));
        }
        noteDeath();
        alive = false;
        if (isArcade() && !playerDeathFx) playerDeathFx = makeArcadePlayerDeathFx();
      }
    }
  }

  if (bits.length) {
    bits = bits.filter(b => b.life > 0);
    for (const b of bits) {
      b.x += b.vx;
      b.y += b.vy;
      b.vy += 0.16;
      b.rot += 0.12;
      b.life -= 1;
    }
  }
  if (cheer) cheer.t += 1;

  tickArcadeDeathFx(dt);

  drawSky();
  for (const o of obstacles) {
    if (o.kind === "plane") drawPlane(o);
    else if (o.kind === "meteor") drawMeteor(o);
    else if (o.kind === "foe") drawFoeUfo(o);
    else if (o.kind === "airplane") drawFoeAirplane(o);
    else if (o.kind === "flyingcar") drawFoeFlyingCar(o);
    else drawOtherBird(o);
    if (isArcade() && o.arcadeFlame) drawArcadeHitDamage(o);
    if (isArcade() && o.arcadeHitFlash > 0) drawArcadeHurtFlash(o);
  }
  drawArcadeFoeDeathFx();
  drawArcadeAbsorbWorld();
  drawBird();
  drawArcadePlayerDeathFx();
  drawArcadeCombat();
  drawCheer();
  drawArcadePerks();

  if (started || panel === "menu") {
    ctx.fillStyle = ink();
    ctx.font = "600 18px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText("flyBy  " + Math.floor(dist), 16, 40);
    ctx.font = "14px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText("best " + best, 16, 60);
  }

  if (started && !alive) drawDeath();
  else if (!started) {
  if (panel === "options") drawOptions();
    else if (panel === "store") drawStore();
    else if (panel === "store-theme") drawStoreTheme();
    else if (panel === "store-characters") drawStoreCharacters();
    else if (panel === "store-bundles") drawStoreBundles();
    else if (panel === "soon") drawSoon();
    else if (panel === "ranks") drawRanks();
    else drawMenu();
  }

  if (buyToast && buyToast.msg) {
    buyToast.t += 1;
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.72)";
    const tw = Math.min(260, W - 40);
    const th = 36;
    const tx = W / 2 - tw / 2;
    const ty = H - 90;
    ctx.beginPath();
    ctx.roundRect(tx, ty, tw, th, 10);
    ctx.fill();
    ctx.fillStyle = cream;
    ctx.font = "600 15px ui-sans-serif, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(buyToast.msg, W / 2, ty + th / 2);
    ctx.restore();
    if (buyToast.t > 180) buyToast = null;
  }

  requestAnimationFrame(loop);
}
resize();
requestAnimationFrame(loop);

/** In-game orb preview: ?arcadePreview=sky|night|future|space (&hud=1 for active HUD) */
(function arcadePreviewBoot() {
  try {
    const q = new URLSearchParams(location.search);
    const themeId = q.get("arcadePreview");
    if (!themeId) return;
    window.__arcadePreview = true;
    applyGameMode("arcade");
    // unlock paid themes for preview captures (local only)
    try {
      ["night", "space", "future"].forEach(k => localStorage.setItem("flyby-own-" + k, "1"));
    } catch (e) {}
    if (typeof applyTheme === "function") applyTheme(themeId);
    function seed() {
      if (!W || !H) { requestAnimationFrame(seed); return; }
      const d = ARCADE_PERK_DEFS[0];
      arcadePickups = [{
        id: d.id, label: d.label, color: d.color, duration: d.duration,
        x: W * 0.5, y: H * 0.38, r: 22, vy: 0,
        born: performance.now()
      }];
      obstacles = [];
      if (q.get("hud") === "1") {
        const d = defs[0];
        arcadeActive = { id: d.id, label: d.label, color: d.color, until: performance.now() + 60000 };
        arcadeSpareArmed = true;
      }
      started = true;
      alive = true;
      panel = "menu";
      document.title = "arcadePreview:" + themeId + (q.get("hud") === "1" ? "+hud" : "");
    }
    // give sprite loads a beat, then seed
    setTimeout(seed, 400);
  } catch (err) {
    console.error("arcadePreviewBoot", err);
  }
})();


/** Live Arcade run capture: ?arcadeLive=sky|night|future|space — real spawn path, no seeded composites.
 *  Combat stills: ?arcadeLive=THEME&demoCombat=1&perk=0 (mg) or perk=1 (laser). STYLE = arcadeFireStyle().
 *  Ghost stills: ?arcadeLive=THEME&demoGhost=1&remain=MS (visual alpha only; default remain 3500).
 *  Formations: ?arcadeLive=THEME&demoPhase2=mg|laser|ghost&formVariant=gallery|weave|slam
 *  (missing/invalid formVariant rolls the perk pool) or demoCombat=1&perk=0|1|2&demoFormation=1.
 *  Real perk pacing look clips: ?arcadeLive=THEME&realPace=1 = real maybeSpawnArcadePerk spacing + live foes. */
(function arcadeLiveBoot() {
  try {
    const q = new URLSearchParams(location.search);
    const themeId = q.get("arcadeLive");
    if (!themeId) return;
    window.__arcadeLiveCapture = true;
    applyGameMode("arcade");
    try {
      ["night", "space", "future", "ufo", "flytaxi"].forEach(k => localStorage.setItem("flyby-own-" + k, "1"));
    } catch (e) {}
    if (typeof applyTheme === "function") applyTheme(themeId);
    function go() {
      if (!W || !H) { requestAnimationFrame(go); return; }
      reset(); // real run (resetArcadeRunState + started/alive)
      // Capture-only for real session look clips (?arcadeLive=THEME&realPace=1).
      // Real maybeSpawnArcadePerk spacing + live foes; no seeded orb, no demo flags.
      const realPace = q.get("realPace") === "1";
      if (realPace) {
        window.__arcadeRealPaceCapture = true;
        if (themeId === "sky" || themeId === "night") applyCharacter("bird");
        else if (themeId === "space") applyCharacter(q.get("character") || "ufo");
        else if (themeId === "future") applyCharacter("flytaxi");
        arcadePickups = [];
        arcadeOrbPop = null;
        arcadeBullets = [];
        arcadeFireAt = 0;
        // do NOT clear arcadePerkSpawn — keep resetArcadeRunState delay
        // do NOT set any __arcadeDemo* flags
        panel = "menu";
        document.title = "arcadeLive:" + themeId + ":realPace";
        return; // skip seeded-orb else
      }
      // one orb alone mid-path (matches Arcade Plan: never cluster for capture)
      const which = Number(q.get("perk") || 0) || 0;
      const d = ARCADE_PERK_DEFS[Math.max(0, Math.min(ARCADE_PERK_DEFS.length - 1, which))];
      const phaseMs = Number(q.get("phase") || 0) || 0;
      const demoPickup = q.get("demoPickup") === "1";
      const demoCombat = q.get("demoCombat") === "1";
      const demoGhost = q.get("demoGhost") === "1";
      const phase2Raw = String(q.get("demoPhase2") || "").toLowerCase();
      const phase2Id = phase2Raw === "mg" ? "mg"
        : phase2Raw === "laser" ? "laser"
        : phase2Raw === "ghost" ? "invincible" : "";
      const demoFormation = q.get("demoFormation") === "1";
      const wantForm = !!phase2Id || (demoFormation && demoCombat && d.id !== "spare");
      // demoPickup: Classic flight line only (bird default W*0.5,H*0.72) — no path/formation shifts.
      // Scrub with &t=MS (deterministic): orb falls toward bird, then absorb phases, then HUD.
      // popAge windows: 0-200 approach, 200-360 shatter, 360-700 stream, 700-800 vanish, 800+ HUD.
      // Phases: fall / approach / shatter / stream / vanish / hud
      // (chrome virtual-time alone does not reliably advance rAF physics for clips)
      if (wantForm) {
        if (themeId === "sky" || themeId === "night") applyCharacter("bird");
        else if (themeId === "space") applyCharacter(q.get("character") || "ufo");
        else if (themeId === "future") applyCharacter("flytaxi");
        arcadePickups = [];
        arcadeOrbPop = null;
        arcadePerkSpawn = 0;
        arcadeBullets = [];
        arcadeFireAt = 0;
        obstacles = [];
        const formDef = phase2Id
          ? ARCADE_PERK_DEFS.find(def => def.id === phase2Id)
          : d;
        arcadeActive = {
          id: formDef.id,
          label: formDef.label,
          color: formDef.color,
          until: performance.now() + 600000
        };
        const fv = String(q.get("formVariant") || "").toLowerCase();
        arcadeFormArm(formDef.id, { force: true, variant: fv || undefined });
        const distRaw = q.get("dist");
        const distNum = distRaw == null || distRaw === "" ? NaN : Number(distRaw);
        dist = Number.isFinite(distNum) ? distNum : 2200;
        spawn = 999;
        window.__arcadeDemoFormation = phase2Raw || (d.id === "invincible" ? "ghost" : d.id);
        document.title = (phase2Id
          ? ("arcadeLive:" + themeId + ":demoPhase2:" + phase2Raw)
          : ("arcadeLive:" + themeId + ":demoFormation:perk=" + which))
          + (arcadeFormVariant ? (":" + arcadeFormVariant) : "");
        panel = "menu";
      } else if (demoPickup) {
        window.__arcadeCaptureScrub = true;
        const tMs = Math.max(0, Number(q.get("t") || 0) || 0);
        const startY = H * 0.72 - 220;
        const vySim = 2.8; // px per ~16ms tick (matches tickArcadePerks)
        const birdY = H * 0.72;
        const hitR = 22 + 26;
        const travelMs = Math.max(1, ((birdY - hitR) - startY) / vySim * 16);
        arcadePerkSpawn = 0;
        panel = "menu";
        let phaseName = "fall";
        if (tMs < travelMs) {
          const y = startY + vySim * (tMs / 16);
          arcadePickups = [{
            id: d.id, label: d.label, color: d.color, duration: d.duration,
            x: W * 0.5, y, r: 22, vy: 0,
            born: performance.now() - phaseMs - tMs
          }];
          arcadeOrbPop = null;
          arcadeActive = null;
        } else {
          const popAge = tMs - travelMs;
          const hitY = birdY - hitR;
          arcadePickups = [];
          phaseName = arcadeAbsorbPhaseAt(popAge).name;
          if (popAge < ARCADE_ABSORB_MS) {
            arcadeOrbPop = makeArcadeOrbPop(d.id, W * 0.5, hitY, d.color, {
              t0: performance.now() - popAge,
              scrubAge: popAge
            });
          } else {
            arcadeOrbPop = null;
          }
          arcadeActive = {
            id: d.id, label: d.label, color: d.color,
            until: performance.now() + d.duration * 1000
          };
        }
        document.title = "arcadeLive:" + themeId + ":demoPickup:t=" + tMs + ":" + phaseName;
      } else if (demoCombat) {
        window.__arcadeDemoCombat = true;
        window.__arcadeDemoCombatPerk = which;
        if (themeId === "sky" || themeId === "night") applyCharacter("bird");
        else if (themeId === "space") applyCharacter(q.get("character") || "ufo");
        else if (themeId === "future") applyCharacter("flytaxi");
        arcadePickups = [];
        arcadeOrbPop = null;
        arcadePerkSpawn = 0;
        arcadeBullets = [];
        arcadeFireAt = 0;
        arcadeActive = {
          id: d.id, label: d.label, color: d.color,
          until: performance.now() + 600000
        };
        const mildVy = 1.35;
        obstacles = [];
        for (let i = 0; i < 3; i++) {
          const kind = (themeId === "night" && i === 1) ? "plane" : "bird";
          const s = kind === "plane" ? 62 : 64;
          obstacles.push({
            kind, x: W * 0.5, y: H * (0.16 + i * 0.16), vy: mildVy, s,
            frame: 0, flap: 0, arcadeHits: 0
          });
        }
        panel = "menu";
        document.title = "arcadeLive:" + themeId + ":demoCombat:perk=" + which + ":" + arcadeFireStyle();
      } else if (demoGhost) {
        window.__arcadeDemoGhost = true;
        if (themeId === "sky" || themeId === "night") applyCharacter("bird");
        else if (themeId === "space") applyCharacter(q.get("character") || "ufo");
        else if (themeId === "future") applyCharacter("flytaxi");
        arcadePickups = [];
        arcadeOrbPop = null;
        arcadePerkSpawn = 0;
        arcadeBullets = [];
        arcadeFireAt = 0;
        obstacles = [];
        const ghostDef = ARCADE_PERK_DEFS.find(def => def.id === "invincible");
        const remainRaw = q.get("remain");
        const remainNum = remainRaw == null || remainRaw === "" ? NaN : Number(remainRaw);
        const remainMs = Number.isFinite(remainNum) ? remainNum : 3500;
        arcadeActive = {
          id: ghostDef.id,
          label: ghostDef.label,
          color: ghostDef.color,
          until: performance.now() + remainMs
        };
        panel = "menu";
        document.title = "arcadeLive:" + themeId + ":demoGhost:remain=" + remainMs;
      } else {
        const orbY = H * 0.38;
        const orbVy = (q.get("freeze") === "1") ? 0 : 0.45;
        arcadePickups = [{
          id: d.id, label: d.label, color: d.color, duration: d.duration,
          x: W * 0.5, y: orbY, r: 22,
          vy: orbVy,
          // phase= for capture GIFs (virtual-time alone can freeze sin phase)
          born: performance.now() - phaseMs
        }];
        arcadePerkSpawn = 0;
        panel = "menu";
        document.title = "arcadeLive:" + themeId + ":n=" + arcadePickups.length;
      }
    }
    setTimeout(go, 600);
  } catch (err) {
    console.error("arcadeLiveBoot", err);
  }
})();

</script>
