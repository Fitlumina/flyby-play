<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>flyBy</title>
<meta name="description" content="A one-thumb dodge flight. Drag the bird. Don't sit still." />
<link rel="icon" href="icon-192.png" />
<style>
  :root { --sky: #b7e4f6; --ink: #1a1a1a; --cream: #e6d3b0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 18px/1.45 ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    background: var(--sky);
  }
  header, main, footer { width: min(980px, calc(100% - 32px)); margin: 0 auto; }
  header { padding: 28px 0 8px; display: flex; align-items: center; gap: 14px; }
  header img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-size: 42px; margin: 0; letter-spacing: -0.03em; }
  .lede { font-size: 22px; margin: 8px 0 0; }
  .shots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 28px 0 8px;
  }
  .shots img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 28px;
  }
  .note { max-width: 28em; }
  footer {
    padding: 28px 0 40px;
    display: flex;
    gap: 18px;
    font-size: 16px;
  }
  a { color: var(--ink); }
  @media (max-width: 700px) {
    h1 { font-size: 34px; }
    .shots { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <img src="icon-512.png" alt="flyBy" />
  <div>
    <h1>flyBy</h1>
    <p class="lede">Drag to fly. Dodge the planes. Don't sit still.</p>
  </div>
</header>
<main>
  <div class="shots">
    <img src="art/drag.png" alt="flyBy start screen on a blue sky" />
    <img src="art/dodge.png" alt="A flight through sketch clouds and paper planes" />
    <img src="art/night.png" alt="flyBy night theme" />
  </div>
  <p class="note">A one-thumb dodge flight. Drag the bird. Planes dive. Other birds cut across. The opening moves, so camping a lane does not last.</p>
  <p class="note">Sky is the look you start on. Themes are an in-app purchase, and more are on the way.</p>
</main>
<footer>
  <a href="/privacy">Privacy</a>
  <a href="/support">Support</a>
</footer>
</body>
</html>
