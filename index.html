<style>
  :root {
    --sky: #b7e4f6;
    --ink: #1a1a1a;
    --cream: #e6d3b0;
    --btn: #1a1a1a;
    --btn-text: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 18px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--sky);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .wrap { width: min(980px, calc(100% - 32px)); margin: 0 auto; }
  header {
    padding: 24px 0 8px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header img.icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
  }
  h1 {
    font-size: clamp(32px, 6vw, 42px);
    margin: 0;
    letter-spacing: -0.03em;
  }
  .lede { font-size: clamp(18px, 3.2vw, 22px); margin: 6px 0 0; opacity: 0.92; }
  .hero {
    margin: 20px 0 0;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(20, 50, 80, 0.18);
    background: #9fd4ec;
  }
  .hero img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1200 / 630;
    object-fit: cover;
  }
  .cta-block {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 28px;
    margin: 28px 0 8px;
  }
  .cta-copy { flex: 1 1 240px; max-width: 28em; }
  .cta-copy p { margin: 0 0 12px; }
  .badge {
    display: inline-block;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    background: rgba(255,255,255,0.55);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--btn);
    color: var(--btn-text);
    text-decoration: none;
    font-weight: 650;
    font-size: 18px;
    padding: 16px 28px;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,0,0,0.22); }
  .btn:active { transform: translateY(0); }
  .btn svg { flex-shrink: 0; }
  .qr-wrap {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #ffffff;
    border-radius: 20px;
    padding: 18px 18px 14px;
    box-shadow: 0 8px 24px rgba(20, 50, 80, 0.12);
    margin-inline: auto;
  }
  .qr-wrap img {
    width: 148px;
    height: 148px;
    display: block;
    margin: 0 auto;
    object-fit: contain;
    background: #ffffff;
  }
  .qr-wrap span {
    display: block;
    margin-top: 10px;
    font-size: 13px;
    opacity: 0.8;
  }
  footer {
    margin-top: auto;
    padding: 32px 0 40px;
    display: flex;
    gap: 18px;
    font-size: 16px;
  }
  footer a { color: var(--ink); }
  @media (max-width: 560px) {
    .cta-block { flex-direction: column; align-items: stretch; }
    .btn { width: 100%; }
    .qr-wrap { align-self: center; }
  }
</style>

<body>
<header class="wrap">
  <img class="icon" src="/icon-512.png" width="56" height="56" alt="flyBy" />
  <div>
    <h1>flyBy</h1>
    <p class="lede">Drag to fly. Dodge the planes. Don’t sit still.</p>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <img
      src="/art/og-share.png?v=4"
      width="1200"
      height="630"
      alt="flyBy sky gameplay — drag to fly, dodge planes"
      fetchpriority="high"
    />
  </div>

  <div class="cta-block">
    <div class="cta-copy">
      <span class="badge">Free · US App Store</span>
      <p>A free endless flyer. Drag the bird, dodge planes and other birds — the gap keeps moving, so camping a lane won’t last.</p>
      <a
        class="btn"
        href="https://apps.apple.com/us/app/flyby-game/id6810003271"
        target="_blank"
        rel="noopener noreferrer"

        </svg>
        Download on the App Store
      </a>
    </div>
    <div class="qr-wrap">
      <img src="/art/qr-appstore.png?v=3" width="148" height="148" alt="QR code to download flyBy on the App Store" />
      <span>Scan to open on your phone</span>
    </div>
  </div>
</main>

<footer class="wrap">
  <a href="/privacy">Privacy</a>
  <a href="/legal">Legal</a>
  <a href="/support">Support</a>
</footer>
</body>
</html>
